# nginx gotcha that this file is shaped around:
#
#   add_header directives are NOT merged across levels. A location block that
#   declares ANY add_header of its own discards every add_header inherited from
#   the server block.
#
# "/" resolves through try_files to /index.html, which matches the `location =
# /index.html` block below. Declaring Cache-Control there silently dropped all
# the security headers — confirmed by curling the running container, not by
# reading the config. Hence the security headers are repeated in every location
# that sets a header of its own.

server {
    # 8080 rather than 80 so the server can run unprivileged: binding a port
    # below 1024 requires root or an explicit capability.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hides the nginx version (the product name still appears; removing that
    # entirely needs a module nginx does not ship by default).
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening, applied to responses from locations that add no
    # headers of their own.
    #
    # A Content-Security-Policy belongs here too in a real deployment. It is
    # omitted rather than guessed: a CSP written without knowing the actual
    # asset and API origins is either ineffective or breaks the page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single-page app: unknown paths are client-side routes, not missing files,
    # so fall back to index.html rather than 404. Without this, refreshing on
    # any route other than "/" breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames with a content hash, so a given URL's
    # content never changes and can be cached indefinitely.
    location /assets/ {
        # max-age set here rather than via `expires`, which would emit its own
        # Cache-Control and leave the response carrying two of them.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is NOT fingerprinted — it is what points at the hashed assets.
    # Caching it would pin browsers to a previous deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
